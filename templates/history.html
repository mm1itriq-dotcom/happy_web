<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Web - History</title>
    <link rel="stylesheet" href="../static/style.css">
</head>
<body>
    <div class="container dashboard-container">
        <nav>
            <a href="analyze.html">Analyze</a>
            <a href="history.html" class="active">History</a>
            <a href="profile.html">Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>

        <div class="card">
            <h2>Your Journey</h2>
            
            <div class="error-msg" id="history-error"></div>

            <div class="history-list" id="history-list">
                <!-- Items will be injected here by JS -->
                <p style="text-align: center; color: var(--text-light);" id="loading-msg">Loading history...</p>
            </div>
        </div>
    </div>

    <script src="../static/app.js"></script>
    <script>
        checkAuth();

        async function loadHistory() {
            try {
                const data = await fetchApi('/history');
                const listEl = document.getElementById('history-list');
                listEl.innerHTML = ''; // clear loading

                if (data.history.length === 0) {
                    listEl.innerHTML = '<p style="text-align: center; color: var(--text-light);">No entries yet. Start analyzing!</p>';
                    return;
                }

                data.history.forEach(item => {
                    const date = new Date(item.created_at).toLocaleDateString(undefined, {
                        month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    const label = item.sentiment_label.toLowerCase();
                    let badgeClass = 'badge-neutral';
                    if (label === 'happy') badgeClass = 'badge-happy';
                    if (label === 'sad') badgeClass = 'badge-sad';

                    const itemHtml = `
                        <div class="history-item" style="cursor: pointer;" onclick="const details = this.querySelector('.history-details'); details.style.display = details.style.display === 'none' ? 'block' : 'none';">
                            <div class="history-header">
                                <span class="history-date">${date}</span>
                                <span class="badge ${badgeClass}">${item.sentiment_label.toUpperCase()}</span>
                            </div>
                            <div class="history-text">"${item.text}"</div>
                            <div class="history-details" style="display: none; margin-top: 1rem; padding-top: 1rem; border-top: 0.0625rem solid var(--card-border); font-size: 0.9rem; color: var(--text-light);">
                                <div style="display: flex; justify-content: space-between;">
                                    <span>Happy: <strong style="color: var(--happy-color);">${item.happy_percentage}%</strong></span>
                                    <span>Neutral: <strong style="color: var(--neutral-color);">${item.neutral_percentage}%</strong></span>
                                    <span>Sad: <strong style="color: var(--sad-color);">${item.sad_percentage}%</strong></span>
                                </div>
                            </div>
                        </div>
                    `;
                    listEl.innerHTML += itemHtml;
                });
            } catch (err) {
                showError('history-error', err.message);
                document.getElementById('loading-msg').style.display = 'none';
            }
        }

        loadHistory();
    </script>
</body>
</html>
